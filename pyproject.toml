[project]
name = "swiss-broker-mcp"
version = "0.1.0"
description = "AI Co-Pilot fuer Schweizer Immobilien-Makler (MCP Server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "affz18" }]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # respx: HTTP mocking fuer httpx in Tests. Aktuell nicht in Tests
    # genutzt (alle Tools nutzen embedded Daten), aktiviert ab Tool 4+
    # wenn Live-API-Calls (BFS pxweb / opendata.swiss) gemockt werden.
    "respx>=0.21.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# JSON-Resources (PLZ-Tabelle) muessen ins Wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/utils/swiss_zip_data.json" = "src/utils/swiss_zip_data.json"

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

# --- mypy ---
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["fastmcp.*", "respx.*"]
ignore_missing_imports = true

# --- ruff ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long - black/ruff format handles
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"] # assert in tests is fine
